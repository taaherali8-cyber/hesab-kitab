<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>حساب و کتاب</title>
<style>
:root{--primary:#00897B;--primary-dark:#00695C;--bg:#F5F5F5;--surface:#FFF;--text:#212121;--text2:#757575;--border:#E0E0E0;--green:#2E7D32;--red:#C62828;--green-bg:#E8F5E9;--red-bg:#FFEBEE;--shadow:0 2px 8px rgba(0,0,0,0.08);--primary-light:#E0F2F1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.content{flex:1;overflow-y:auto;padding-bottom:20px}
.screen{display:none;padding-bottom:20px}
.screen.active{display:block}
.header{background:var(--primary);color:#fff;padding:20px 16px 24px;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
.header h1{font-size:20px;font-weight:700}
.page-header{background:var(--surface);padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.page-header h1{font-size:18px;font-weight:700}
.list{padding:12px;display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px;line-height:1.8}
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;color:#fff;background:#5C6BC0}
.card-body{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:600;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text2)}
.card-amount{font-size:15px;font-weight:700;flex-shrink:0}
.card-amount.debit{color:var(--green)}
.card-amount.credit{color:var(--red)}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:700;background:var(--primary-light);color:var(--primary)}
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:20px;background:var(--primary);color:#fff;border:none;width:56px;height:56px;border-radius:18px;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,0.2);cursor:pointer;z-index:50}
.bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 0;z-index:60}
.bottom-nav button{flex:1;background:none;border:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text2);font-family:inherit;font-size:11px;cursor:pointer}
.bottom-nav button.active{color:var(--primary);font-weight:700}
.bottom-nav button .icon{font-size:22px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;z-index:9999}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:500px;padding:20px 16px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;margin-bottom:16px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;padding:12px;font-family:inherit;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:#FAFAFA;color:var(--text);outline:none}
.type-toggle{display:flex;gap:8px;margin-bottom:14px}
.type-toggle button{flex:1;padding:10px;border:1.5px solid var(--border);background:var(--surface);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2)}
.type-toggle button.active[data-type="debit"]{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.type-toggle button.active[data-type="credit"]{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.date-row{display:flex;gap:6px}
.date-row select{flex:1}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:13px;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn-cancel{background:var(--border);color:var(--text)}
.btn-save{background:var(--primary);color:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:10000;opacity:0;pointer-events:none;transition:opacity 0.3s}
.toast.show{opacity:1}
.action-buttons{display:flex;gap:10px;padding:16px}
.action-btn-big{flex:1;padding:16px;border-radius:14px;border:none;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.action-btn-big.debit{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.action-btn-big.credit{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.summary-section{margin:16px;padding:16px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.summary-row:last-child{border-bottom:none;padding-top:12px;font-weight:700;font-size:16px}
.search-box{padding:12px;background:var(--surface)}
.search-box input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:#FAFAFA;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.add-person-btn{background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}

/* Status Bar - نمایش پیشرفت */
#statusBar{position:fixed;top:0;left:0;right:0;background:#FF9800;color:#fff;padding:6px 12px;font-family:monospace;font-size:11px;z-index:99999;text-align:center;font-weight:bold;transition:background 0.3s}
#statusBar.ok{background:#4CAF50}
#statusBar.error{background:#F44336;text-align:left;white-space:pre-wrap;max-height:50vh;overflow:auto}
</style>
</head>
<body>

<div id="statusBar">در حال بارگذاری...</div>

<div class="app" id="app">
  <div class="content" id="content">
    <div class="screen active" id="homeScreen">
      <div class="header"><h1>حساب و کتاب</h1></div>
      <div class="action-buttons">
        <button class="action-btn-big debit" id="btnAddDebit">↓ ثبت بدهی</button>
        <button class="action-btn-big credit" id="btnAddCredit">↑ ثبت طلب</button>
      </div>
      <div style="font-size:13px;color:var(--text2);font-weight:700;padding:8px 16px;">اشخاص</div>
      <div class="list" id="homeList"></div>
      <div class="summary-section">
        <div class="summary-row"><span>مجموع طلب من:</span><span id="homeTotalDebit" style="color:var(--green);font-weight:700;">0</span></div>
        <div class="summary-row"><span>مجموع بدهی من:</span><span id="homeTotalCredit" style="color:var(--red);font-weight:700;">0</span></div>
        <div class="summary-row"><span>مانده کل:</span><span id="homeBalance">0</span></div>
      </div>
    </div>
    <div class="screen" id="historyScreen">
      <div class="page-header"><h1>تاریخچه</h1></div>
      <div class="search-box"><input type="text" id="historySearch" placeholder="جستجو..."></div>
      <div class="list" id="historyList"></div>
    </div>
    <div class="screen" id="peopleScreen">
      <div class="page-header"><h1>اشخاص</h1><button class="add-person-btn" id="btnAddPerson">+ شخص جدید</button></div>
      <div class="search-box"><input type="text" id="peopleSearch" placeholder="جستجوی شخص..."></div>
      <div class="list" id="peopleList"></div>
    </div>
    <div class="screen" id="settingsScreen">
      <div class="page-header"><h1>تنظیمات</h1></div>
      <div style="padding:16px;">
        <p style="text-align:center;color:var(--text2);line-height:2;">نسخه آزمایشی ۵.۰<br>در حال ساخت...</p>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="active" data-tab="homeScreen"><span class="icon">🏠</span><span>خانه</span></button>
    <button data-tab="historyScreen"><span class="icon">📜</span><span>تاریخچه</span></button>
    <button data-tab="peopleScreen"><span class="icon">👥</span><span>اشخاص</span></button>
    <button data-tab="settingsScreen"><span class="icon">⚙️</span><span>تنظیمات</span></button>
  </nav>
</div>

<div class="modal-overlay" id="personModal">
  <div class="modal">
    <h2 id="personModalTitle">افزودن شخص</h2>
    <div class="field"><label>نام شخص</label><input type="text" id="personNameInput" placeholder="مثلاً علی"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelPerson">انصراف</button>
      <button class="btn-save" id="btnSavePerson">ذخیره</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="transactionModal">
  <div class="modal">
    <h2 id="txModalTitle">تراکنش جدید</h2>
    <div class="type-toggle" id="txTypeToggle">
      <button data-type="debit" class="active">بدهکار</button>
      <button data-type="credit">بستانکار</button>
    </div>
    <div class="field" id="txPersonSelectContainer" style="display:none">
      <label>انتخاب شخص</label>
      <select id="txPersonSelect"></select>
    </div>
    <div class="field"><label>مبلغ</label><input type="text" id="txAmount" placeholder="50,000" inputmode="numeric" dir="ltr"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelTx">انصراف</button>
      <button class="btn-save" id="btnSaveTx">ذخیره</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var statusEl = document.getElementById('statusBar');
  var statusLog = '';
  
  function setStatus(msg, type) {
    statusLog += '[' + type + '] ' + msg + '\n';
    if (statusEl) {
      statusEl.textContent = statusLog;
      statusEl.className = type;
    }
  }
  
  function step(name, fn) {
    try {
      fn();
      setStatus('✓ ' + name, 'ok');
    } catch (e) {
      setStatus('✗ ' + name + ': ' + e.message, 'error');
      console.error(name, e);
    }
  }

  // متغیرهای اصلی
  var people = [];
  var transactions = [];
  var currentTxType = 'debit';
  var currentSelectedPersonId = null;
  var editingPersonId = null;
  var STORAGE_KEY = 'hesab_ketab_v5';
  
  window._vars = { people: people, transactions: transactions };

  function get(id) { return document.getElementById(id); }
  function fmt(n) { return Number(n).toLocaleString('en-US'); }
  
  function toast(msg) {
    var t = get('toast');
    if (t) { t.textContent = msg; t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2200); }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ people: people, transactions: transactions }));
    } catch (e) {}
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d) return;
      if (Array.isArray(d.people)) { people.length = 0; for (var i=0;i<d.people.length;i++) people.push(d.people[i]); }
      if (Array.isArray(d.transactions)) { transactions.length = 0; for (var j=0;j<d.transactions.length;j++) transactions.push(d.transactions[j]); }
    } catch (e) { console.error('loadData', e); }
  }

  function getPersonBalance(pid) {
    var bal = 0;
    for (var i = 0; i < transactions.length; i++) {
      if (transactions[i].personId === pid) {
        if (transactions[i].type === 'debit') bal += transactions[i].amount;
        else bal -= transactions[i].amount;
      }
    }
    return bal;
  }

  function switchTab(screenId, btn) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
    var target = get(screenId);
    if (target) target.classList.add('active');
    var btns = document.querySelectorAll('.bottom-nav button');
    for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
    if (btn) btn.classList.add('active');
    if (screenId === 'homeScreen') renderHome();
    if (screenId === 'historyScreen') renderHistory();
    if (screenId === 'peopleScreen') renderPeopleList();
  }

  function renderHome() {
    var td = 0, tc = 0;
    for (var i = 0; i < transactions.length; i++) {
      if (transactions[i].type === 'debit') td += transactions[i].amount;
      else tc += transactions[i].amount;
    }
    var dEl = get('homeTotalDebit'); if (dEl) dEl.textContent = fmt(td);
    var cEl = get('homeTotalCredit'); if (cEl) cEl.textContent = fmt(tc);
    var bal = td - tc, balEl = get('homeBalance');
    if (balEl) {
      balEl.textContent = fmt(Math.abs(bal));
      if (bal > 0) { balEl.style.color = 'var(--green)'; }
      else if (bal < 0) { balEl.style.color = 'var(--red)'; }
    }
    var el = get('homeList');
    if (!el) return;
    if (people.length === 0) { el.innerHTML = '<div class="empty">هنوز شخصی ثبت نشده است</div>'; return; }
    var html = '';
    for (var k = 0; k < people.length; k++) {
      var p = people[k];
      var pBal = getPersonBalance(p.id);
      var color = pBal > 0 ? 'var(--green)' : (pBal < 0 ? 'var(--red)' : 'var(--text2)');
      var balText = pBal > 0 ? fmt(pBal) : (pBal < 0 ? fmt(-pBal) : '0');
      html += '<div class="card" data-person-id="' + p.id + '">' +
        '<div class="avatar">' + p.name.charAt(0) + '</div>' +
        '<div class="card-body"><div class="card-name">' + p.name + '</div></div>' +
        '<div class="card-amount" style="color:' + color + '">' + balText + '</div></div>';
    }
    el.innerHTML = html;
    attachPersonCards();
  }

  function renderHistory() {
    var el = get('historyList');
    if (!el) return;
    if (transactions.length === 0) { el.innerHTML = '<div class="empty">تراکنشی ثبت نشده</div>'; return; }
    var list = [];
    for (var i = 0; i < transactions.length; i++) list.push(transactions[i]);
    list.sort(function(a, b) { return b.id - a.id; });
    var html = '';
    for (var j = 0; j < list.length; j++) {
      var t = list[j];
      var pName = 'ناشناس';
      for (var k = 0; k < people.length; k++) { if (people[k].id === t.personId) { pName = people[k].name; break; } }
      var sign = t.type === 'debit' ? '↓' : '↑';
      var bg = t.type === 'debit' ? 'var(--green)' : 'var(--red)';
      html += '<div class="card">' +
        '<div class="avatar" style="background:' + bg + '">' + sign + '</div>' +
        '<div class="card-body"><div class="card-name">' + pName + '</div><div class="card-sub">' + t.date + '</div></div>' +
        '<div class="card-amount ' + t.type + '">' + fmt(t.amount) + '</div></div>';
    }
    el.innerHTML = html;
  }

  function renderPeopleList() {
    var el = get('peopleList');
    if (!el) return;
    if (people.length === 0) { el.innerHTML = '<div class="empty">شخصی ثبت نشده</div>'; return; }
    var html = '';
    for (var i = 0; i < people.length; i++) {
      var p = people[i];
      var bal = getPersonBalance(p.id);
      var color = bal > 0 ? 'var(--green)' : (bal < 0 ? 'var(--red)' : 'var(--text2)');
      var txt = bal > 0 ? fmt(bal) : (bal < 0 ? fmt(-bal) : '0');
      html += '<div class="card">' +
        '<div class="avatar">' + p.name.charAt(0) + '</div>' +
        '<div class="card-body"><div class="card-name">' + p.name + '</div>' +
        '<div class="card-sub">مانده: <span style="color:' + color + ';font-weight:700;">' + txt + '</span></div></div></div>';
    }
    el.innerHTML = html;
  }

  function attachPersonCards() {
    var cards = document.querySelectorAll('#homeList .card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function() {
        var pid = parseInt(this.getAttribute('data-person-id'));
        alert('شخص انتخاب شد: ' + pid);
      });
    }
  }

  function openAddPersonModal() {
    editingPersonId = null;
    get('personModalTitle').textContent = 'افزودن شخص';
    get('personNameInput').value = '';
    get('personModal').classList.add('show');
  }
  function closePersonModal() { get('personModal').classList.remove('show'); }
  
  function savePerson() {
    var name = get('personNameInput').value.trim();
    if (!name) { toast('نام را وارد کنید'); return; }
    if (editingPersonId) {
      for (var i = 0; i < people.length; i++) { if (people[i].id === editingPersonId) people[i].name = name; }
      toast('ویرایش شد');
    } else {
      people.push({ id: Date.now(), name: name });
      toast('ثبت شد');
    }
    saveData();
    closePersonModal();
    renderPeopleList();
    renderHome();
  }

  function openQuickAdd(type) {
    if (people.length === 0) {
      toast('ابتدا یک شخص تعریف کنید');
      return;
    }
    get('txPersonSelectContainer').style.display = 'block';
    var sel = get('txPersonSelect');
    sel.innerHTML = '';
    for (var i = 0; i < people.length; i++) {
      sel.innerHTML += '<option value="' + people[i].id + '">' + people[i].name + '</option>';
    }
    get('txModalTitle').textContent = type === 'debit' ? 'ثبت بدهی' : 'ثبت طلب';
    get('txAmount').value = '';
    get('transactionModal').classList.add('show');
  }
  function closeTransactionModal() { get('transactionModal').classList.remove('show'); }
  function setTxType(t, btn) {
    currentTxType = t;
    var btns = document.querySelectorAll('#txTypeToggle button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    if (btn) btn.classList.add('active');
  }
  function saveTransaction() {
    var amt = parseFloat(get('txAmount').value.replace(/,/g, ''));
    if (!amt || amt <= 0) { toast('مبلغ معتبر وارد کنید'); return; }
    var pid = parseInt(get('txPersonSelect').value);
    if (!pid) { toast('شخص را انتخاب کنید'); return; }
    transactions.push({
      id: Date.now(),
      personId: pid,
      type: currentTxType,
      amount: amt,
      date: '1404/01/01'
    });
    saveData();
    closeTransactionModal();
    renderHome();
    renderHistory();
    renderPeopleList();
    toast('ثبت شد');
  }

  function attachAllEvents() {
    // نوار پایین
    var navBtns = document.querySelectorAll('.bottom-nav button');
    for (var i = 0; i < navBtns.length; i++) {
      navBtns[i].addEventListener('click', function() {
        var tab = this.getAttribute('data-tab');
        switchTab(tab, this);
      });
    }
    // ثبت بدهی/طلب
    get('btnAddDebit').addEventListener('click', function() { openQuickAdd('debit'); });
    get('btnAddCredit').addEventListener('click', function() { openQuickAdd('credit'); });
    // شخص جدید
    get('btnAddPerson').addEventListener('click', openAddPersonModal);
    get('btnCancelPerson').addEventListener('click', closePersonModal);
    get('btnSavePerson').addEventListener('click', savePerson);
    // تراکنش
    get('btnCancelTx').addEventListener('click', closeTransactionModal);
    get('btnSaveTx').addEventListener('click', saveTransaction);
    var txTypeBtns = document.querySelectorAll('#txTypeToggle button');
    for (var j = 0; j < txTypeBtns.length; j++) {
      txTypeBtns[j].addEventListener('click', function() {
        setTxType(this.getAttribute('data-type'), this);
      });
    }
    // فرمت مبلغ
    get('txAmount').addEventListener('input', function(e) {
      var raw = e.target.value.replace(/[^\d]/g, '');
      e.target.value = raw === '' ? '' : Number(raw).toLocaleString('en-US');
    });
  }

  // اجرای گام‌به‌گام
  step('بارگذاری داده', loadData);
  step('اتصال رویدادها', attachAllEvents);
  step('نمایش خانه', renderHome);
  step('نمایش اشخاص', renderPeopleList);
  step('نمایش تاریخچه', renderHistory);

  setTimeout(function() {
    if (statusEl) {
      statusEl.textContent = '✓ همه چیز آماده است - دکمه‌ها را تست کنید';
      statusEl.className = 'ok';
      setTimeout(function() { statusEl.style.display = 'none'; }, 4000);
    }
  }, 500);

})();
</script>
</body>
</html>
