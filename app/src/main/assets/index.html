<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>حساب و کتاب</title>
<style>
:root[data-theme="light"]{--primary:#00897B;--primary-dark:#00695C;--bg:#F5F5F5;--surface:#FFF;--text:#212121;--text2:#757575;--border:#E0E0E0;--input-bg:#FAFAFA;--shadow:0 2px 8px rgba(0,0,0,0.08);--green:#2E7D32;--green-bg:#E8F5E9;--red:#C62828;--red-bg:#FFEBEE;--nav-shadow:0 -2px 8px rgba(0,0,0,0.06);--primary-light:#E0F2F1}
:root[data-theme="dark"]{--primary:#26A69A;--primary-dark:#00897B;--bg:#121212;--surface:#1E1E1E;--text:#E0E0E0;--text2:#9E9E9E;--border:#333;--input-bg:#2A2A2A;--shadow:0 2px 8px rgba(0,0,0,0.4);--green:#66BB6A;--green-bg:#1B2E1F;--red:#EF5350;--red-bg:#2E1B1B;--nav-shadow:0 -2px 8px rgba(0,0,0,0.3);--primary-light:#00332E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen{display:none;padding-bottom:20px}
.screen.active{display:block}
.hidden{display:none !important}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:20px 16px 24px;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.header h1{font-size:20px;font-weight:700}
.stats{display:flex;gap:10px}
.stat{flex:1;background:rgba(255,255,255,0.15);border-radius:12px;padding:10px 12px}
.stat .label{font-size:11px;opacity:0.9;margin-bottom:4px}
.stat .value{font-size:17px;font-weight:700}
.stat.debit .value{color:#B9F6CA}
.stat.credit .value{color:#FFCDD2}
.balance{margin-top:10px;padding:10px 14px;background:rgba(255,255,255,0.18);border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.balance .label{font-size:13px}
.balance .value{font-size:18px;font-weight:700;transition:color 0.3s}
.page-header{background:var(--surface);padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.page-header h1{font-size:18px;font-weight:700}
.list{padding:12px;display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:60px 20px;color:var(--text2);font-size:14px;line-height:1.8}
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;position:relative;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;color:#fff}
.card-body{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-sub{font-size:12px;color:var(--text2)}
.card-amount{font-size:15px;font-weight:700;flex-shrink:0}
.card-amount.debit{color:var(--green)}
.card-amount.credit{color:var(--red)}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:700;background:var(--primary-light);color:var(--primary)}
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:20px;background:var(--primary);color:#fff;border:none;width:56px;height:56px;border-radius:18px;font-size:28px;box-shadow:0 6px 16px rgba(0,137,123,0.4);cursor:pointer;z-index:50}
.bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--nav-shadow);padding:6px 0 env(safe-area-inset-bottom,6px)}
.bottom-nav button{flex:1;background:none;border:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text2);font-family:inherit;font-size:11px;cursor:pointer}
.bottom-nav button.active{color:var(--primary);font-weight:700}
.bottom-nav button .icon{font-size:22px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:500px;padding:20px 16px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;margin-bottom:16px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;padding:12px;font-family:inherit;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--input-bg);color:var(--text);outline:none}
.type-toggle{display:flex;gap:8px;margin-bottom:14px}
.type-toggle button{flex:1;padding:10px;border:1.5px solid var(--border);background:var(--surface);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2)}
.type-toggle button.active[data-type="debit"]{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.type-toggle button.active[data-type="credit"]{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.date-row{display:flex;gap:6px}
.date-row select{flex:1}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:13px;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn-cancel{background:var(--border);color:var(--text)}
.btn-save{background:var(--primary);color:#fff}
.settings-group{padding:8px 12px}
.settings-group h3{font-size:12px;color:var(--text2);font-weight:700;padding:8px 6px 6px}
.setting-item{background:var(--surface);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.setting-item .setting-label{font-size:14px;font-weight:600}
.setting-item .setting-sub{font-size:12px;color:var(--text2);margin-top:2px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity 0.3s}
.toast.show{opacity:1}

/* استایل صفحه جزئیات شخص */
.detail-screen { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; }
.detail-screen.show { transform: translateX(0); }
.detail-header { background: var(--surface); padding: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); }
.detail-header .back-btn { background: none; border: none; font-size: 24px; color: var(--primary); cursor: pointer; padding: 0 8px; }
.detail-header-info { flex: 1; }
.detail-header-info h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.detail-header-info .balance { font-size: 14px; font-weight: 700; }
.detail-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.add-person-btn { background: var(--primary); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="content" id="content">
    <!-- صفحه خانه (خلاصه) -->
    <div class="screen active" id="homeScreen">
      <div class="header">
        <div class="header-top">
          <h1>حساب و کتاب</h1>
        </div>
        <div class="stats">
          <div class="stat debit"><div class="label">طلب من</div><div class="value" id="totalDebit">0</div></div>
          <div class="stat credit"><div class="label">بدهی من</div><div class="value" id="totalCredit">0</div></div>
        </div>
        <div class="balance"><span class="label" id="balanceLabel">مانده</span><span class="value" id="balanceValue">0</span></div>
      </div>
      <div class="section-title" style="font-size:13px;color:var(--text2);font-weight:700;padding:8px 14px 4px;">آخرین تراکنش‌ها</div>
      <div class="list" id="homeList"></div>
    </div>

    <!-- صفحه اشخاص -->
    <div class="screen" id="peopleScreen">
      <div class="page-header">
        <h1>اشخاص</h1>
        <button class="add-person-btn" onclick="openAddPersonModal()">+ شخص جدید</button>
      </div>
      <div class="list" id="peopleList"></div>
    </div>

    <!-- صفحه تنظیمات -->
    <div class="screen" id="settingsScreen">
      <div class="page-header"><h1>تنظیمات</h1></div>
      <div class="settings-group">
        <h3>ظاهر</h3>
        <div class="setting-item" onclick="toggleTheme()">
          <div class="setting-info"><div class="setting-label">تم برنامه</div><div class="setting-sub" id="themeStatus">روشن</div></div>
          <div style="font-size:22px;">🎨</div>
        </div>
      </div>
      <div class="settings-group">
        <h3>داده‌ها</h3>
        <div class="setting-item" onclick="backupData()">
          <div class="setting-info"><div class="setting-label">💾 پشتیبان‌گیری</div><div class="setting-sub">ذخیره اطلاعات در فایل</div></div>
          <div style="color:var(--primary);">›</div>
        </div>
        <div class="setting-item" onclick="restoreData()">
          <div class="setting-info"><div class="setting-label">📂 بازیابی</div><div class="setting-sub">بازیابی از فایل پشتیبان</div></div>
          <div style="color:var(--primary);">›</div>
        </div>
      </div>
    </div>
  </div>

  <button class="fab" id="fabBtn" onclick="openAddPersonModal()">＋</button>

  <nav class="bottom-nav">
    <button class="active" onclick="switchTab('homeScreen', this)"><span class="icon">🏠</span><span>خانه</span></button>
    <button onclick="switchTab('peopleScreen', this)"><span class="icon">👥</span><span>اشخاص</span></button>
    <button onclick="switchTab('settingsScreen', this)"><span class="icon">⚙️</span><span>تنظیمات</span></button>
  </nav>
</div>

<!-- صفحه جزئیات یک شخص (تمام صفحه) -->
<div class="detail-screen" id="personDetailScreen">
  <div class="detail-header">
    <button class="back-btn" onclick="closePersonDetail()">➔</button>
    <div class="detail-header-info">
      <h2 id="detailPersonName">نام شخص</h2>
      <div class="balance" id="detailPersonBalance">0</div>
    </div>
  </div>
  <div class="detail-list" id="personTransactionsList"></div>
  <button class="fab" onclick="openAddTransactionModal()">＋</button>
</div>

<!-- مودال ثبت شخص جدید -->
<div class="modal-overlay" id="addPersonModal">
  <div class="modal">
    <h2>افزودن شخص جدید</h2>
    <div class="field"><label>نام شخص</label><input type="text" id="newPersonName" placeholder="مثلاً علی"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddPersonModal()">انصراف</button>
      <button class="btn-save" onclick="savePerson()">ذخیره</button>
    </div>
  </div>
</div>

<!-- مودال ثبت تراکنش جدید (برای شخص انتخاب شده) -->
<div class="modal-overlay" id="addTransactionModal">
  <div class="modal">
    <h2 id="txModalTitle">تراکنش جدید</h2>
    <div class="type-toggle">
      <button data-type="debit" class="active" onclick="setType('debit', this)">بدهکار (طلب من)</button>
      <button data-type="credit" onclick="setType('credit', this)">بستانکار (بدهی من)</button>
    </div>
    <div class="field"><label>مبلغ</label><input type="text" id="txAmount" placeholder="50,000" inputmode="numeric" dir="ltr"></div>
    <div class="field"><label>دسته‌بندی</label>
      <select id="txCategory">
        <option value="قرض">قرض</option>
        <option value="خرید">خرید</option>
        <option value="حقوق">حقوق</option>
        <option value="وام">وام</option>
        <option value="سایر">سایر</option>
      </select>
    </div>
    <div class="field"><label>تاریخ (شمسی)</label>
      <div class="date-row">
        <select id="txYear"></select>
        <select id="txMonth"></select>
        <select id="txDay"></select>
      </div>
    </div>
    <div class="field"><label>توضیحات (اختیاری)</label><input type="text" id="txNote" placeholder="مثلاً علی‌الحساب"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddTransactionModal()">انصراف</button>
      <button class="btn-save" onclick="saveTransaction()">ذخیره</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==========================================
// داده‌ها و متغیرها
// ==========================================
var people = []; // { id, name }
var transactions = []; // { id, personId, type, amount, date, category, note }

var currentType = 'debit';
var currentSelectedPersonId = null;
var monthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

var STORAGE_KEY = 'hesab_ketab_v2';

// ==========================================
// ابزارهای کمکی
// ==========================================
function get(id) { return document.getElementById(id); }
function fmt(num) { return Number(num).toLocaleString('en-US'); }
function toast(msg) {
  var t = get('toast');
  if(t) { t.textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2000); }
}

// ==========================================
// ذخیره و بازیابی خودکار
// ==========================================
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ people: people, transactions: transactions }));
  } catch(e) {}
}

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var data = JSON.parse(raw);
      people = data.people || [];
      transactions = data.transactions || [];
    } else {
      migrateOldData(); // اگر اطلاعات نسخه قبلی وجود داشت، منتقل کن
    }
  } catch(e) { people = []; transactions = []; }
}

// انتقال اطلاعات از نسخه 1 به 2
function migrateOldData() {
  var old = localStorage.getItem('hesab_ketab_data_v1');
  if (!old) return;
  try {
    var oldEntries = JSON.parse(old);
    if (!Array.isArray(oldEntries)) return;
    var map = {};
    for (var i = 0; i < oldEntries.length; i++) {
      var e = oldEntries[i];
      if (!map[e.name]) {
        var pid = Date.now() + Math.random();
        map[e.name] = pid;
        people.push({ id: pid, name: e.name });
      }
      transactions.push({
        id: e.id, personId: map[e.name], type: e.type, amount: e.amount, date: e.date, category: e.category || 'سایر', note: e.note || ''
      });
    }
    saveData();
    localStorage.removeItem('hesab_ketab_data_v1');
  } catch(e) {}
}

// ==========================================
// محاسبات
// ==========================================
function getPersonBalance(personId) {
  var bal = 0;
  for (var i = 0; i < transactions.length; i++) {
    if (transactions[i].personId === personId) {
      if (transactions[i].type === 'debit') bal += transactions[i].amount;
      else bal -= transactions[i].amount;
    }
  }
  return bal;
}

// ==========================================
// تاریخ شمسی
// ==========================================
function getTodayJalali() {
  var now = new Date();
  var gy = now.getFullYear(), gm = now.getMonth() + 1, gd = now.getDate();
  var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  var jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053); days %= 12053;
  jy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  var jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return { jy: jy, jm: jm, jd: jd };
}

function getMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return [1,5,9,13,17,22,26,30].indexOf(jy % 33) >= 0 ? 30 : 29;
}

function fillDateSelectors() {
  var t = getTodayJalali();
  var selY = get('txYear'), selM = get('txMonth'), selD = get('txDay');
  var htmlY = '';
  for (var i = 1400; i <= 1420; i++) htmlY += '<option value="' + i + '"' + (i === t.jy ? ' selected' : '') + '>' + i + '</option>';
  selY.innerHTML = htmlY;
  var htmlM = '';
  for (var j = 1; j <= 12; j++) htmlM += '<option value="' + j + '"' + (j === t.jm ? ' selected' : '') + '>' + monthNames[j-1] + '</option>';
  selM.innerHTML = htmlM;
  updateDayOptions(t.jd);
  selY.onchange = function() { updateDayOptions(); };
  selM.onchange = function() { updateDayOptions(); };
}

function updateDayOptions(selectDay) {
  var y = +get('txYear').value, m = +get('txMonth').value;
  var len = getMonthLength(y, m);
  var prev = selectDay || +get('txDay').value || 1;
  if (prev > len) prev = len;
  var html = '';
  for (var d = 1; d <= len; d++) html += '<option value="' + d + '"' + (d === prev ? ' selected' : '') + '>' + d + '</option>';
  get('txDay').innerHTML = html;
}

// ==========================================
// ناوبری
// ==========================================
function switchTab(screenId, btn) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) { screens[i].classList.remove('active'); }
  var target = get(screenId);
  if (target) { target.classList.add('active'); }
  var btns = document.querySelectorAll('.bottom-nav button');
  for (var j = 0; j < btns.length; j++) { btns[j].classList.remove('active'); }
  if (btn) { btn.classList.add('active'); }

  var fab = get('fabBtn');
  if (fab) {
    if (screenId === 'settingsScreen') fab.style.display = 'none';
    else { fab.style.display = 'block'; fab.textContent = '+'; }
  }
}

function openPersonDetail(personId) {
  currentSelectedPersonId = personId;
  var person = people.find(function(p) { return p.id === personId; });
  if (!person) return;

  get('detailPersonName').textContent = person.name;

  var bal = getPersonBalance(personId);
  var balEl = get('detailPersonBalance');
  balEl.textContent = fmt(Math.abs(bal));
  if (bal > 0) { balEl.style.color = 'var(--green)'; balEl.textContent = 'طلب من: ' + fmt(bal); }
  else if (bal < 0) { balEl.style.color = 'var(--red)'; balEl.textContent = 'بدهی من: ' + fmt(-bal); }
  else { balEl.style.color = 'var(--text2)'; balEl.textContent = 'تسویه'; }

  renderPersonTransactions();
  get('personDetailScreen').classList.add('show');
}

function closePersonDetail() {
  get('personDetailScreen').classList.remove('show');
  currentSelectedPersonId = null;
}

function renderPersonTransactions() {
  var list = get('personTransactionsList');
  var listTx = transactions.filter(function(t) { return t.personId === currentSelectedPersonId; });
  listTx.sort(function(a, b) { return b.id - a.id; });

  if (listTx.length === 0) {
    list.innerHTML = '<div class="empty">هنوز تراکنشی برای این شخص ثبت نشده است.<br>برای ثبت، دکمه + را بزنید.</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < listTx.length; i++) {
    var t = listTx[i];
    var sign = t.type === 'debit' ? '↓' : '↑';
    var bgColor = t.type === 'debit' ? '#2E7D32' : '#C62828';
    var catHtml = t.category ? '<span class="badge">' + t.category + '</span>' : '';
    var noteHtml = t.note ? ' • ' + t.note : '';
    html += '<div class="card">' +
      '<div class="avatar" style="background:' + bgColor + '">' + sign + '</div>' +
      '<div class="card-body">' +
      '<div class="card-name">' + t.type === 'debit' ? 'بدهکار' : 'بستانکار' + ' ' + catHtml + '</div>' +
      '<div class="card-sub">' + t.date + noteHtml + '</div>' +
      '</div>' +
      '<div class="card-amount ' + t.type + '">' + fmt(t.amount) + '</div>' +
      '</div>';
  }
  list.innerHTML = html;
}

// ==========================================
// رندر کردن لیست اشخاص
// ==========================================
function renderPeopleList() {
  var el = get('peopleList');
  if (people.length === 0) {
    el.innerHTML = '<div class="empty">هنوز شخصی تعریف نکرده‌اید.<br>روی دکمه + یا «شخص جدید» بزنید.</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < people.length; i++) {
    var p = people[i];
    var bal = getPersonBalance(p.id);
    var balClass = bal >= 0 ? 'debit' : 'credit';
    var balText = bal > 0 ? fmt(bal) : (bal < 0 ? fmt(-bal) : '0');
    var color = bal > 0 ? 'var(--green)' : (bal < 0 ? 'var(--red)' : 'var(--text2)');

    html += '<div class="card" onclick="openPersonDetail(' + p.id + ')">' +
      '<div class="avatar" style="background:#5C6BC0">' + p.name.charAt(0) + '</div>' +
      '<div class="card-body">' +
      '<div class="card-name">' + p.name + '</div>' +
      '<div class="card-sub">' + (bal === 0 ? 'تسویه' : (bal > 0 ? 'طلب من' : 'بدهی من')) + '</div>' +
      '</div>' +
      '<div class="card-amount" style="color:' + color + '">' + balText + '</div>' +
      '<div style="color:var(--text2);font-size:18px;margin-right:8px;">‹</div>' +
      '</div>';
  }
  el.innerHTML = html;
}

// ==========================================
// محاسبه کل و رندر صفحه خانه
// ==========================================
function renderHome() {
  var td = 0, tc = 0;
  for (var i = 0; i < transactions.length; i++) {
    if (transactions[i].type === 'debit') td += transactions[i].amount;
    else tc += transactions[i].amount;
  }
  get('totalDebit').textContent = fmt(td);
  get('totalCredit').textContent = fmt(tc);

  var bal = td - tc;
  var balEl = get('balanceValue');
  var balLbl = get('balanceLabel');
  balEl.textContent = fmt(Math.abs(bal));
  if (bal > 0) { balEl.style.color = '#B9F6CA'; balLbl.textContent = 'مانده (طلبکار)'; }
  else if (bal < 0) { balEl.style.color = '#FFCDD2'; balLbl.textContent = 'مانده (بدهکار)'; }
  else { balEl.style.color = '#FFFFFF'; balLbl.textContent = 'مانده'; }

  var recent = transactions.slice(-5).reverse();
  var hList = get('homeList');
  if (recent.length === 0) {
    hList.innerHTML = '<div class="empty">هنوز تراکنشی ثبت نشده است</div>';
    return;
  }

  var html = '';
  for (var k = 0; k < recent.length; k++) {
    var t = recent[k];
    var person = people.find(function(p) { return p.id === t.personId; });
    var pName = person ? person.name : 'ناشناس';
    var sign = t.type === 'debit' ? '↓' : '↑';
    var bgColor = t.type === 'debit' ? '#2E7D32' : '#C62828';
    html += '<div class="card" onclick="openPersonDetail(' + t.personId + ')">' +
      '<div class="avatar" style="background:' + bgColor + '">' + sign + '</div>' +
      '<div class="card-body">' +
      '<div class="card-name">' + pName + '</div>' +
      '<div class="card-sub">' + t.date + '</div>' +
      '</div>' +
      '<div class="card-amount ' + t.type + '">' + fmt(t.amount) + '</div>' +
      '</div>';
  }
  hList.innerHTML = html;
}

// ==========================================
// ثبت شخص جدید
// ==========================================
function openAddPersonModal() {
  get('newPersonName').value = '';
  get('addPersonModal').classList.add('show');
}

function closeAddPersonModal() {
  get('addPersonModal').classList.remove('show');
}

function savePerson() {
  var name = get('newPersonName').value.trim();
  if (!name) { toast('نام را وارد کنید'); return; }
  var exists = people.find(function(p) { return p.name === name; });
  if (exists) { toast('این شخص قبلاً ثبت شده است'); return; }
  people.push({ id: Date.now(), name: name });
  saveData();
  closeAddPersonModal();
  renderPeopleList();
  toast('شخص ثبت شد');
}

// ==========================================
// ثبت تراکنش جدید
// ==========================================
function openAddTransactionModal() {
  get('txModalTitle').textContent = 'تراکنش برای: ' + people.find(function(p) { return p.id === currentSelectedPersonId; }).name;
  get('txAmount').value = '';
  get('txNote').value = '';
  get('txCategory').value = 'قرض';
  setType('debit', document.querySelector('.type-toggle button[data-type="debit"]'));
  fillDateSelectors();
  get('addTransactionModal').classList.add('show');
}

function closeAddTransactionModal() {
  get('addTransactionModal').classList.remove('show');
}

function setType(t, btn) {
  currentType = t;
  var btns = document.querySelectorAll('.type-toggle button');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
  if (btn) { btn.classList.add('active'); }
}

function saveTransaction() {
  var amountStr = get('txAmount').value.replace(/,/g, '');
  var amount = parseFloat(amountStr);
  var category = get('txCategory').value;
  var note = get('txNote').value.trim();
  var y = get('txYear').value, m = get('txMonth').value, d = get('txDay').value;

  if (!amount || amount <= 0) { toast('مبلغ معتبر وارد کنید'); return; }

  transactions.push({
    id: Date.now(),
    personId: currentSelectedPersonId,
    type: currentType,
    amount: amount,
    category: category,
    note: note,
    date: y + '/' + String(m).padStart(2,'0') + '/' + String(d).padStart(2,'0')
  });

  saveData();
  closeAddTransactionModal();
  openPersonDetail(currentSelectedPersonId); // صفحه شخص را رفرش کن
  renderPeopleList(); // لیست اشخاص را هم رفرش کن
  renderHome(); // صفحه خانه را هم رفرش کن
  toast('تراکنش ثبت شد');
}

// ==========================================
// تم، پشتیبان‌گیری و بقیه
// ==========================================
function toggleTheme() {
  var html = document.documentElement;
  if (html.getAttribute('data-theme') === 'light') { html.setAttribute('data-theme', 'dark'); get('themeStatus').textContent = 'تاریک'; }
  else { html.setAttribute('data-theme', 'light'); get('themeStatus').textContent = 'روشن'; }
}

function backupData() {
  if (!window.AndroidBridge || !window.AndroidBridge.exportBackup) { toast('خطا: پل ارتباطی پیدا نشد'); return; }
  var data = JSON.stringify({ people: people, transactions: transactions });
  window.AndroidBridge.exportBackup("1", 'hesab_ketab_backup.json', data);
  toast('در حال ذخیره...');
}
window.onExportResult = function(id, success) { toast(success ? 'پشتیبان ذخیره شد' : 'ذخیره لغو شد'); };

function restoreData() {
  if (!window.AndroidBridge || !window.AndroidBridge.importBackup) { toast('خطا: پل ارتباطی پیدا نشد'); return; }
  window.AndroidBridge.importBackup("1");
  toast('در حال باز کردن فایل...');
}
window.onImportResult = function(id, content, error) {
  if (error || !content) { if (error !== 'cancelled') toast('خطا در بازیابی'); return; }
  try {
    var data = JSON.parse(content);
    if (data.people && data.transactions) {
      people = data.people;
      transactions = data.transactions;
      saveData();
      renderPeopleList();
      renderHome();
      toast('بازیابی انجام شد');
    } else { toast('فایل نامعتبر است'); }
  } catch(e) { toast('فایل نامعتبر است'); }
};

get('txAmount').addEventListener('input', function(e) {
  var raw = e.target.value.replace(/[^\d]/g, '');
  e.target.value = raw === '' ? '' : Number(raw).toLocaleString('en-US');
});

// ==========================================
// شروع
// ==========================================
loadData();
renderPeopleList();
renderHome();
</script>
</body>
  </html>
