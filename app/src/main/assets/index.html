<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تست</title>
</head>
<body style="font-family:Tahoma;padding:20px;background:#f5f5f5;">

<div style="background:#d32f2f;color:#fff;padding:15px;border-radius:10px;font-size:18px;text-align:center;font-weight:bold;">
نسخهٔ تست — v2.0
</div>

<div id="status" style="background:#ff9800;color:#fff;padding:15px;border-radius:10px;margin:15px 0;font-size:18px;text-align:center;font-weight:bold;">
JS: در حال اجرا نشده
</div>

<button onclick="testClick()" style="width:100%;padding:25px;font-size:22px;background:#00897b;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer;">
دکمهٔ تست
</button>

<div id="clicks" style="margin-top:15px;padding:15px;background:#fff;border-radius:10px;font-size:16px;text-align:center;">
تعداد کلیک: 0
</div>

<div id="info" style="margin-top:15px;padding:15px;background:#fff;border-radius:10px;font-size:13px;text-align:center;color:#666;">
اطلاعات سیستم اینجا نمایش داده می‌شود
</div>

<script>
var clickCount = 0;

// این خطوط اگر اجرا شوند، رنگ سبز می‌شود
document.getElementById('status').textContent = 'JS: اجرا شد ✓';
document.getElementById('status').style.background = '#388e3c';

// اطلاعات سیستم
var info = 'AndroidBridge: ';
try {
  info += (window.AndroidBridge ? 'دارد ✓' : 'ندارد');
} catch (e) {
  info += 'خطا: ' + e.message;
}
info += '\nlocalStorage: ';
try {
  localStorage.setItem('test', '1');
  localStorage.removeItem('test');
  info += 'کار می‌کند ✓';
} catch (e) {
  info += 'خطا: ' + e.message;
}
info += '\nProtocol: ' + window.location.protocol;
info += '\nUserAgent: ' + (navigator.userAgent || '?').substring(0, 60);
document.getElementById('info').textContent = info;
document.getElementById('info').style.whiteSpace = 'pre-wrap';
document.getElementById('info').style.textAlign = 'left';
document.getElementById('info').style.direction = 'ltr';

// تابع کلیک
function testClick() {
  clickCount++;
  document.getElementById('clicks').textContent = 'تعداد کلیک: ' + clickCount;
  document.getElementById('clicks').style.background = '#c8e6c9';
}

// خطاها رو نشون بده
window.onerror = function(m, u, l) {
  var st = document.getElementById('status');
  st.textContent = 'خطا: ' + m + ' در خط ' + l;
  st.style.background = '#d32f2f';
  return true;
};
</script>

</body>
</html>
